[project]
name = "ratchat"
version = "1.0.0"
description = "Turn a natural-language bug report into a verified failing test."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Abhinav Singh" }]
keywords = ["testing", "reproduction", "llm-agents", "regression-test"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

# The core stays dependency-free: the offline replay that reproduces every
# reported number must keep needing nothing but the standard library. The MCP
# server is the one surface that needs a third-party package, so it is an extra.
[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
ratchat-mcp = "ratchat.mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ratchat*"]

[tool.ruff]
line-length = 100
