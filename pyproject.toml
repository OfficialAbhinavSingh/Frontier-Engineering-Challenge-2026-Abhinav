[project]
name = "reprobot"
version = "1.0.0"
description = "Turn a natural-language bug report into a verified failing test."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reprobot*"]

[tool.ruff]
line-length = 100
